# WSMP-Woodcutting configuration
# Points are an in-plugin currency earned from tasks and the Ancient Grove
# Legendary Request — NOT real money, NOT shared with any other plugin.
# Every number in this file is a placeholder ratio; rebalance to taste.

settings:
  block-cheesy-farms: true
  skip-cost: 150.0
  task-block-cost: 200.0
  master-teleport-cost: 6600.0
  master-teleport-cooldown-minutes: 30
  guide-book-cooldown-hours: 24
  npc-shop-radius: 5.0

tiers:
  1:
    name: "Tier 1"
    display: "&aTier 1"
    difficulty: "Very Easy"
    min-level: 1
    base-coins: 10
    premium: false
    resources:
      OAK_LOG: {type: WOODCUTTING, level: 1, min-amount: 20, max-amount: 40}
      BIRCH_LOG: {type: WOODCUTTING, level: 1, min-amount: 20, max-amount: 35}
      SPRUCE_LOG: {type: WOODCUTTING, level: 1, min-amount: 20, max-amount: 35}
  2:
