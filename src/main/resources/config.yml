      ACACIA_LOG: {type: WOODCUTTING, level: 10, min-amount: 20, max-amount: 35}
      DARK_OAK_LOG: {type: WOODCUTTING, level: 12, min-amount: 20, max-amount: 35}
  3:
    name: "Tier 3"
    display: "&eTier 3"
    difficulty: "Moderate"
    min-level: 25
    base-coins: 40
    premium: true
    resources:
      MANGROVE_LOG: {type: WOODCUTTING, level: 25, min-amount: 15, max-amount: 30}
      CHERRY_LOG: {type: WOODCUTTING, level: 27, min-amount: 15, max-amount: 30}
  4:
    name: "Tier 4"
    display: "&6Tier 4"
    difficulty: "Hard"
    min-level: 40
    base-coins: 70
    premium: true
    resources:
      JUNGLE_WOOD: {type: WOODCUTTING, level: 42, min-amount: 15, max-amount: 30}
      DARK_OAK_WOOD: {type: WOODCUTTING, level: 40, min-amount: 15, max-amount: 30}
  5:
    name: "Tier 5"
    display: "&cTier 5"
    difficulty: "Very Hard"
    min-level: 55
    base-coins: 120
    premium: true
    resources:
      CRIMSON_HYPHAE: {type: WOODCUTTING, level: 55, min-amount: 15, max-amount: 25}
      WARPED_HYPHAE: {type: WOODCUTTING, level: 58, min-amount: 15, max-amount: 25}
  6:
    name: "Tier 6"
    display: "&5Tier 6"
    difficulty: "Elite"
    min-level: 70
    base-coins: 200
    premium: true
    resources:
      CRIMSON_STEM: {type: WOODCUTTING, level: 70, min-amount: 15, max-amount: 25}
      WARPED_STEM: {type: WOODCUTTING, level: 72, min-amount: 15, max-amount: 25}
  7:
    name: "Tier 7"
    display: "&6&lTier 7"
    difficulty: "Legendary"
    min-level: 85
    base-coins: 600
    premium: true
    resources: {}
    # Tier 7 doesn't use a normal task pool — see legendary-requests below.

lucky-strike:
  1: 0.01
  2: 0.02
  3: 0.03
  4: 0.04
  5: 0.05
  6: 0.06
  7: 0.08

# Only one Legendary Request in this split — the Triad Trial (which spanned
# mining/woodcutting/farming) doesn't make sense once the skills are separate
# plugins, so it was retired rather than split. Ancient Grove reuses the
# Crimson/Warped Stem material pair from the old Triad's woodcutting leg.
legendary-requests:
  ancient_grove:
    display: "&b🪓 Ancient Grove"
    material: CRIMSON_STEM
    min-amount: 40
    max-amount: 60
    yield: 600
    cooldown-hours: 12

streak-bonus:
  5: 0.15
  10: 0.25
  25: 0.40
  50: 0.65
  100: 0.90

